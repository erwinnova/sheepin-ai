<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sheepin AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=Newsreader:wght@500&display=swap"
    />
    <style>
      :root {
        --brand: #114636;
        --brand-deep: #0b2f24;
        --wool: #ffffff;
        --surface: #f6f8f7;
        --raised: #ffffff;
        --sunken: #eef1ef;
        --tint: #e3ede7;
        --ink: #13201b;
        --muted: #4f5d56;
        --line: #dfe5e1;
        --line-strong: #7b8a83;
        --ok: #114636;
        --ok-bg: #cfe6da;
        --warn: #8d4b00;
        --warn-bg: #ffdcc3;
        --warn-ink: #6e3900;
        --danger: #b42318;
        --danger-bg: #fbe5e2;
        --danger-ink: #93000a;
        --water: #006398;
        --sans: "Spline Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --serif: "Newsreader", Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        color: var(--brand);
      }
      button {
        font: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      .bar {
        background: var(--brand);
        color: var(--wool);
        padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      }
      .bar .in {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .bar .name {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      .bar .name span {
        font-weight: 400;
        color: #9fd3bb;
      }
      .bar .right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bar .date {
        font-size: 13px;
        color: #cfe6da;
      }
      .lang {
        display: flex;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 9999px;
        overflow: hidden;
      }
      .lang button {
        background: transparent;
        color: #cfe6da;
        border: 0;
        padding: 4px 10px;
        min-height: 32px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
      }
      .lang button[aria-pressed="true"] {
        background: var(--wool);
        color: var(--brand-deep);
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        font-size: 24px;
        line-height: 32px;
        font-weight: 600;
        margin: 8px 0 16px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 18px;
        line-height: 26px;
        font-weight: 600;
        margin: 24px 0 8px;
      }
      p {
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
        line-height: 20px;
      }

      .counts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .chip {
        border: 1px solid var(--line-strong);
        background: var(--raised);
        border-radius: 9999px;
        padding: 6px 12px;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: baseline;
        color: var(--ink);
        min-height: 44px;
      }
      .chip b {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .chip.on {
        border-color: var(--brand);
        background: var(--tint);
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--raised);
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 76px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        min-height: 64px;
      }
      .row:first-child {
        border-top: none;
      }
      .row:hover {
        background: var(--sunken);
      }
      .tag {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .row .meta {
        font-size: 13px;
        line-height: 20px;
        color: var(--muted);
      }
      .kg {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .kg small {
        font-family: var(--sans);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 500;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 9999px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 600;
        line-height: 20px;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.normal {
        background: var(--ok-bg);
        color: var(--brand-deep);
      }
      .badge.waspada {
        background: var(--warn-bg);
        color: var(--warn-ink);
      }
      .badge.segera {
        background: var(--danger-bg);
        color: var(--danger-ink);
      }

      .card {
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card.brand {
        background: var(--brand);
        color: var(--wool);
        border-color: var(--brand);
      }
      .card.brand .muted {
        color: #cfe6da;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        text-decoration: none;
        font-weight: 600;
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .head .tag {
        font-size: 44px;
        line-height: 48px;
      }
      .readings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 16px 0 4px;
      }
      .reading .v {
        font-family: var(--serif);
        font-size: 28px;
        line-height: 32px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .reading .l {
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
      }
      .reading .v.down {
        color: var(--danger);
      }
      .reading .v.warn {
        color: var(--warn);
      }
      .reasons {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .reasons li {
        padding-left: 14px;
        position: relative;
      }
      .reasons li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--warn);
      }
      .reasons li.segera::before {
        background: var(--danger);
      }

      svg.chart {
        width: 100%;
        height: auto;
        display: block;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--brand);
        color: var(--wool);
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--brand-deep);
      }
      .card.brand .btn {
        background: var(--wool);
        color: var(--brand-deep);
      }
      .advice ul {
        margin: 4px 0 12px;
        padding-left: 20px;
      }
      .advice li {
        margin-bottom: 4px;
      }
      .advice h3 {
        font-size: 15px;
        margin: 12px 0 2px;
        font-weight: 600;
        color: #9fd3bb;
      }
      .advice .sum {
        font-size: 17px;
        line-height: 26px;
      }
      .advice .vet {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 12px;
        margin-top: 12px;
      }
      .err {
        background: var(--danger-bg);
        color: var(--danger-ink);
        border-radius: 12px;
        padding: 12px 16px;
      }
      .empty {
        padding: 32px 16px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 420px) {
        .row {
          grid-template-columns: 64px 1fr auto;
        }
        .readings {
          gap: 8px;
        }
        .reading .v {
          font-size: 24px;
        }
        .bar .date {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .pulse {
          animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
          50% {
            opacity: 0.4;
          }
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="in">
        <div class="name">Sheepin <span>AI</span></div>
        <div class="right">
          <div class="date" id="date"></div>
          <div class="lang" role="group" aria-label="Language">
            <button data-lang="id" aria-pressed="false">ID</button>
            <button data-lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>
    </header>
    <main id="app"></main>

    <script>
      // ---------- translations ----------
      const T = {
        id: {
          locale: "id-ID",
          loading: "Memuat data kandang…",
          loadingHist: (t) => `Memuat riwayat ${t}…`,
          dataOf: (d) => `Data ${d}`,
          title: (n) =>
            n
              ? `${n} ekor perlu dilihat hari ini`
              : "Semua ternak dalam kondisi baik",
          level: { segera: "Segera", waspada: "Waspada", normal: "Normal" },
          reason: {
            drop_5: "bobot turun lebih dari 5% dalam 7 hari",
            drop_3: "bobot turun 3–5% dalam 7 hari",
            slow_growth: "pertumbuhan 14 hari di bawah 60% target",
            no_gate: "tidak lewat gerbang 48 jam",
          },
          sex: { jantan: "jantan", betina: "betina" },
          months: (n) => `${n} bulan`,
          pen: (f) => `kandang ${f}`,
          kg: "kg",
          per7d: "/ 7 hari",
          kgToday: "kg hari ini",
          d7: "7 hari",
          gate2d: "lewat gerbang, 2 hari",
          noSignal: (g) =>
            `Tidak ada sinyal yang perlu diwaspadai. Pertumbuhan ${g} kg/hari.`,
          empty: "Tidak ada ternak dengan status ini.",
          listNote:
            "Status ditentukan oleh aturan dari data timbangan dan gerbang otomatis. Ketuk seekor ternak untuk melihat riwayat dan saran.",
          back: "‹ Semua ternak",
          notFound: (t) => `Ternak ${t} tidak ditemukan.`,
          chartTitle: "Bobot 30 hari terakhir",
          chartAria: (n) => `Grafik bobot ${n} hari terakhir`,
          chartNote: (g) =>
            `Garis hijau: bobot tertimbang. Garis biru putus: laju target ${g} kg/hari dari 14 hari lalu.`,
          adviceTitle: "Saran",
          adviceIntro:
            "Gemini membaca riwayat ternak ini dan menjelaskan apa yang sebaiknya dicek dan dilakukan hari ini. Tidak mendiagnosis dan tidak menyebut obat.",
          ask: "Minta saran",
          asking: (t) => `Gemini sedang membaca data ternak ${t}…`,
          check: "Cek hari ini",
          do: "Lakukan",
          vet: "Hubungi dokter hewan jika:",
          by: (m, s) =>
            `Saran dibuat oleh ${m} dalam ${s} detik. Keputusan tetap di tangan Anda dan dokter hewan.`,
          adviceErr: (e) => `Saran belum bisa dibuat: ${e}`,
          retry: "Coba lagi",
          loadErr: (e) =>
            `Data kandang belum bisa dimuat: ${e}. Muat ulang halaman untuk mencoba lagi.`,
        },
        en: {
          locale: "en-GB",
          loading: "Loading the flock…",
          loadingHist: (t) => `Loading history for ${t}…`,
          dataOf: (d) => `Data as of ${d}`,
          title: (n) =>
            n
              ? `${n} animal${n > 1 ? "s" : ""} need a look today`
              : "The whole flock is doing well",
          level: { segera: "Urgent", waspada: "Watch", normal: "Normal" },
          reason: {
            drop_5: "weight down more than 5% in 7 days",
            drop_3: "weight down 3–5% in 7 days",
            slow_growth: "14-day growth below 60% of target",
            no_gate: "no gate passes for 48 hours",
          },
          sex: { jantan: "male", betina: "female" },
          months: (n) => `${n} months`,
          pen: (f) => `pen ${f}`,
          kg: "kg",
          per7d: "/ 7 days",
          kgToday: "kg today",
          d7: "7 days",
          gate2d: "gate passes, 2 days",
          noSignal: (g) => `No signal to worry about. Growing at ${g} kg/day.`,
          empty: "No animals with this status.",
          listNote:
            "Status is set by rules over Smart Scale and auto-gate data. Tap an animal for its history and advice.",
          back: "‹ All animals",
          notFound: (t) => `Animal ${t} not found.`,
          chartTitle: "Weight, last 30 days",
          chartAria: (n) => `Weight chart, last ${n} days`,
          chartNote: (g) =>
            `Green line: scale readings. Dashed blue: target rate of ${g} kg/day from 14 days ago.`,
          adviceTitle: "Advice",
          adviceIntro:
            "Gemini reads this animal's history and explains what to check and do today. It does not diagnose and does not name medicines.",
          ask: "Get advice",
          asking: (t) => `Gemini is reading the data for ${t}…`,
          check: "Check today",
          do: "Do",
          vet: "Call a vet if:",
          by: (m, s) =>
            `Advice generated by ${m} in ${s} seconds. The decision stays with you and your vet.`,
          adviceErr: (e) => `Advice could not be generated: ${e}`,
          retry: "Try again",
          loadErr: (e) =>
            `The flock data could not be loaded: ${e}. Reload the page to try again.`,
        },
      };

      // ---------- language: saved choice, else browser language ----------
      function initialLang() {
        try {
          const s = localStorage.getItem("sheepin.lang");
          if (s === "id" || s === "en") return s;
        } catch (e) {}
        return (navigator.language || "id").toLowerCase().startsWith("id")
          ? "id"
          : "en";
      }
      const state = {
        lang: initialLang(),
        animals: null,
        summary: null,
        filter: null,
        advice: {},
      };
      const t = () => T[state.lang];
      function setLang(l) {
        state.lang = l;
        try {
          localStorage.setItem("sheepin.lang", l);
        } catch (e) {}
        document.documentElement.lang = l;
        document
          .querySelectorAll(".lang button")
          .forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === l));
        if (state.animals) {
          setDate();
          route();
        }
      }
      document
        .querySelectorAll(".lang button")
        .forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));

      // ---------- formatting ----------
      const app = document.getElementById("app");
      const num = (n, d = 1) =>
        n == null
          ? "–"
          : n.toLocaleString(t().locale, {
              minimumFractionDigits: d,
              maximumFractionDigits: d,
            });
      const fmt = {
        kg: (n) => num(n, 1),
        pct: (n) => (n == null ? "–" : (n > 0 ? "+" : "") + num(n, 1) + "%"),
        date: (s) =>
          new Date(s + "T00:00:00").toLocaleDateString(t().locale, {
            day: "numeric",
            month: "long",
            year: "numeric",
          }),
        short: (s) =>
          new Date(s + "T00:00:00").toLocaleDateString(t().locale, {
            day: "numeric",
            month: "short",
          }),
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const reasonText = (a, i) =>
        (a.alasan_kode && a.alasan_kode[i] && t().reason[a.alasan_kode[i]]) ||
        a.alasan_alert[i];
      const who = (a) =>
        `${t().sex[a.jenis_kelamin] || a.jenis_kelamin}, ${t().months(a.umur_bulan)}, ${esc(a.ras)}`;

      // ---------- data ----------
      async function loadList() {
        const r = await fetch("/api/animals");
        if (!r.ok) throw new Error("API " + r.status);
        const data = await r.json();
        state.animals = data.ternak;
        state.summary = data.ringkasan;
        setDate();
      }
      function setDate() {
        const a = state.animals && state.animals[0];
        document.getElementById("date").textContent = a
          ? t().dataOf(fmt.date(a.tanggal_data))
          : "";
      }

      // ---------- routing ----------
      function route() {
        const m = location.hash.match(/^#\/ternak\/([A-Za-z0-9_-]+)$/);
        if (m) renderDetail(m[1]);
        else renderList();
        window.scrollTo(0, 0);
      }

      // ---------- list ----------
      function renderList() {
        const s = state.summary,
          L = t();
        const rows = state.animals.filter(
          (a) => !state.filter || a.tingkat_sistem === state.filter,
        );
        app.innerHTML = `
    <h1>${L.title(s.segera + s.waspada)}</h1>
    <div class="counts">
      ${["segera", "waspada", "normal"]
        .map(
          (l) => `
        <button class="chip ${state.filter === l ? "on" : ""}" data-l="${l}" aria-pressed="${state.filter === l}">
          <span class="dot" style="background:var(--${l === "segera" ? "danger" : l === "waspada" ? "warn" : "ok"})"></span>
          <b>${s[l]}</b> ${L.level[l]}
        </button>`,
        )
        .join("")}
    </div>
    <div class="list">
      ${
        rows.length
          ? rows
              .map(
                (a) => `
        <a class="row" href="#/ternak/${a.ear_tag}">
          <div class="tag">${a.ear_tag}</div>
          <div>
            <span class="badge ${a.tingkat_sistem}">${L.level[a.tingkat_sistem]}</span>
            <div class="meta">${a.alasan_alert.length ? esc(reasonText(a, 0)) : who(a)}</div>
          </div>
          <div class="kg">${fmt.kg(a.bobot_hari_ini_kg)} <small>${L.kg.toUpperCase()}</small>
            <div class="meta" style="color:${a.perubahan_persen < -3 ? "var(--danger)" : "inherit"}">${fmt.pct(a.perubahan_persen)} ${L.per7d}</div></div>
        </a>`,
              )
              .join("")
          : `<div class="empty">${L.empty}</div>`
      }
    </div>
    <p class="small muted" style="margin-top:12px">${L.listNote}</p>`;
        app.querySelectorAll(".chip").forEach(
          (c) =>
            (c.onclick = () => {
              state.filter = state.filter === c.dataset.l ? null : c.dataset.l;
              renderList();
            }),
        );
      }

      // ---------- chart ----------
      function chart(h, target) {
        if (!h || h.length < 2) return "";
        const W = 640,
          H = 220,
          px = 44,
          py = 18,
          fs = 18;
        const ys = h.map((p) => p.kg),
          lo = Math.min(...ys) - 0.8,
          hi = Math.max(...ys) + 0.8;
        const x = (i) => px + (i * (W - 2 * px)) / (h.length - 1);
        const y = (v) => py + ((hi - v) * (H - 2 * py)) / (hi - lo);
        const line = h
          .map(
            (p, i) =>
              `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`,
          )
          .join(" ");
        const i0 = Math.max(0, h.length - 15),
          k0 = h[i0].kg;
        const exp = `M${x(i0).toFixed(1)},${y(k0).toFixed(1)} L${x(h.length - 1).toFixed(1)},${y(k0 + target * (h.length - 1 - i0)).toFixed(1)}`;
        const ticks = [0, Math.floor(h.length / 2), h.length - 1];
        const last = h[h.length - 1];
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t().chartAria(h.length)}">
    ${[lo + 1, (lo + hi) / 2, hi - 1].map((v) => `<line x1="${px}" x2="${W - px}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${px - 8}" y="${y(v) + 6}" font-size="${fs}" text-anchor="end" fill="var(--muted)">${v.toFixed(0)}</text>`).join("")}
    <path d="${exp}" stroke="var(--water)" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
    <path d="${line}" stroke="var(--brand)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    ${h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="2.5" fill="var(--brand)"/>`).join("")}
    <circle cx="${x(h.length - 1)}" cy="${y(last.kg)}" r="5" fill="var(--brand)" stroke="var(--raised)" stroke-width="2"/>
    ${ticks.map((i) => `<text x="${x(i)}" y="${H - 2}" font-size="${fs}" text-anchor="${i === 0 ? "start" : i === h.length - 1 ? "end" : "middle"}" fill="var(--muted)">${fmt.short(h[i].tanggal)}</text>`).join("")}
  </svg>
  <p class="small muted" style="margin-top:4px">${t().chartNote(num(target, 2))}</p>`;
      }

      // ---------- detail ----------
      async function renderDetail(tag) {
        const L = t();
        let a = state.animals.find((x) => x.ear_tag === tag);
        if (!a) {
          app.innerHTML = `<a class="back" href="#/">${L.back}</a><div class="err">${L.notFound(esc(tag))}</div>`;
          return;
        }
        if (!a.riwayat_bobot) {
          app.innerHTML = `<a class="back" href="#/">${L.back}</a><p class="muted">${L.loadingHist(tag)}</p>`;
          try {
            Object.assign(a, await (await fetch(`/api/animals/${tag}`)).json());
          } catch (e) {
            a.riwayat_bobot = [];
          }
        }
        const lvl = a.tingkat_sistem,
          adv = state.advice[state.lang + ":" + tag];
        const cls =
          a.perubahan_persen <= -5
            ? "down"
            : a.perubahan_persen <= -3
              ? "warn"
              : "";
        app.innerHTML = `
    <a class="back" href="#/">${L.back}</a>
    <div class="card">
      <div class="head">
        <div class="tag">${a.ear_tag}</div>
        <span class="badge ${lvl}">${L.level[lvl]}</span>
      </div>
      <p class="muted">${who(a)}, ${L.pen(esc(a.farm_id))}</p>
      <div class="readings">
        <div class="reading"><div class="v ${cls}">${fmt.kg(a.bobot_hari_ini_kg)}</div><div class="l">${L.kgToday}</div></div>
        <div class="reading"><div class="v ${cls}">${fmt.pct(a.perubahan_persen)}</div><div class="l">${L.d7}</div></div>
        <div class="reading"><div class="v ${a.lewat_gerbang_48_jam_terakhir === 0 ? "down" : ""}">${a.lewat_gerbang_48_jam_terakhir}</div><div class="l">${L.gate2d}</div></div>
      </div>
      ${
        a.alasan_alert.length
          ? `<ul class="reasons">${a.alasan_alert.map((_, i) => `<li class="${lvl}">${esc(reasonText(a, i))}</li>`).join("")}</ul>`
          : `<p class="muted">${L.noSignal(num(a.pertumbuhan_14_hari_kg_per_hari ?? 0, 2))}</p>`
      }
    </div>

    <h2>${L.chartTitle}</h2>
    <div class="card">${chart(a.riwayat_bobot, a.target_pertumbuhan_per_hari_kg)}</div>

    <h2>${L.adviceTitle}</h2>
    <div class="card brand advice" id="advice">
      ${adv ? adviceHTML(adv) : `<p class="muted">${L.adviceIntro}</p><button class="btn" id="ask">${L.ask}</button>`}
    </div>`;
        const btn = document.getElementById("ask");
        if (btn) btn.onclick = () => getAdvice(tag);
      }

      function adviceHTML(s) {
        const L = t(),
          li = (xs) => (xs || []).map((x) => `<li>${esc(x)}</li>`).join("");
        return `
    <p class="sum">${esc(s.ringkasan)}</p>
    ${s.cek_hari_ini?.length ? `<h3>${L.check}</h3><ul>${li(s.cek_hari_ini)}</ul>` : ""}
    ${s.lakukan?.length ? `<h3>${L.do}</h3><ul>${li(s.lakukan)}</ul>` : ""}
    ${s.hubungi_dokter_hewan_jika && s.hubungi_dokter_hewan_jika !== "-" ? `<p class="vet"><b>${L.vet}</b> ${esc(s.hubungi_dokter_hewan_jika)}</p>` : ""}
    <p class="small muted" style="margin:12px 0 0">${L.by(esc(s._meta?.model || "Gemini"), num((s._meta?.latency_ms || 0) / 1000, 1))}</p>`;
      }

      async function getAdvice(tag) {
        const L = t(),
          lang = state.lang,
          box = document.getElementById("advice");
        box.innerHTML = `<p class="pulse">${L.asking(tag)}</p>`;
        try {
          const r = await fetch(`/api/animals/${tag}/advice?lang=${lang}`);
          if (!r.ok) {
            const e = await r.json().catch(() => ({}));
            throw new Error(e.detail || "API " + r.status);
          }
          const data = await r.json();
          state.advice[lang + ":" + tag] = data.saran;
          if (state.lang === lang && document.getElementById("advice"))
            box.innerHTML = adviceHTML(data.saran);
        } catch (err) {
          box.innerHTML = `<div class="err">${L.adviceErr(esc(err.message))}</div><p style="margin-top:12px"><button class="btn" id="ask">${L.retry}</button></p>`;
          document.getElementById("ask").onclick = () => getAdvice(tag);
        }
      }

      // ---------- boot ----------
      setLang(state.lang);
      app.innerHTML = `<p class="muted">${t().loading}</p>`;
      loadList()
        .then(route)
        .catch((e) => {
          app.innerHTML = `<div class="err">${t().loadErr(esc(e.message))}</div>`;
        });
      addEventListener("hashchange", route);
    </script>
  </body>
</html>
